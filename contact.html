<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT | 373&DESIGN</title>
    <meta name="description" content="373&DESIGNはWEBデザイナーみなみやのポートフォリオサイトです。ホームページ制作・ランディングページ制作・Web画像制作を承っています。">

    <!-- グーグルフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/others.css" />

    <!-- ファビコン -->
    <link rel="shortcut icon" href="images/main/favicon.ico" type="image/x-icon">

</head>


<body class="body__fadeIn">
    <div class="animation-bg"></div>
    <!-- toTopが戻る位置 -->
    <div id="top"></div>


    <!-- ＝＝＝＝＝共通ヘッダー＝＝＝＝＝ -->
    <div id="header" data-root="./"></div>


    <main>
        <!-- パンくずリスト -->
        <nav>
            <ol class="breadcrumb">
                <li><a href="index.html">HOME</a></li>
                <li aria-current="page">CONTACT</li>
            </ol>
        </nav>


        <!-- コンタクト -->
        <section class="inview fadeIn">
            <h1>
                <img src="images/main/contact.svg" alt="contact">
            </h1>
            <p class="contact__text">
                ホームページ制作・各種デザインのご依頼など、お気軽にお問い合わせください。<br>
                無料でご相談、お見積もりを承っております。<br>
                名刺などWEBデザイン以外でも「こんなのもお願いできる？」というご相談もどうぞ。<br>
                2営業日以内にお返事させていただきます。
            </p>
            <!-- フォーム -->
            <form
                action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSdQImct5mT2iWtTLfsDno_DsMSQ95WPG9yVIEKlljz3YfjXWg/formResponse"
                method="POST" target="hidden_iframe" onsubmit="submitted=true;" class="c-form">
                <!-- 名前 -->
                <div class="c-form__item">
                    <label class="c-form__label" for="field-name">お名前</label>
                    <input name="entry.554421420" class="c-form__input" id="field-name" placeholder="山田&emsp;花子"
                        type="text" required="required" />
                </div>
                <!-- フリガナ -->
                <div class="c-form__item">
                    <label class="c-form__label" for="field-furigana">フリガナ</label>
                    <input name="entry.636249629" class="c-form__input" id="field-furigana" placeholder="ヤマダ&emsp;ハナコ"
                        type="text" required="required" />
                </div>
                <!-- 会社名 -->
                <div class="c-form__item">
                    <label class="c-form__label no-required" for="field-company">会社名</label>
                    <input name="entry.1812092247" class="c-form__input" id="field-company" placeholder="373&DESIGN" />
                </div>
                <!-- メールアドレス -->
                <div class="c-form__item">
                    <label class="c-form__label" for="field-mail">メールアドレス</label>
                    <input name="entry.1190064390" class="c-form__input" id="field-mail" placeholder="aaaa@aaaa.co.jp"
                        type="email" required="required" />
                </div>

                <!-- ご用件 -->
                <div class="c-form__item">
                    <label class="c-form__label" for="field-name">ご用件</label>
                    <div class="form__radio--wrapper">
                        <label class="label__radio">
                            <input type="radio" name="entry.767609341" value="ホームページ制作のご相談" class="input__radio"
                                required>
                            <span class="radio__span">ホームページ制作のご相談</span>
                        </label>
                        <label class="label__radio">
                            <input type="radio" name="entry.767609341" value="ランディングページ制作のご相談" class="input__radio">
                            <span class="radio__span">ランディングページ制作のご相談</span>
                        </label>
                        <label class="label__radio">
                            <input type="radio" name="entry.767609341" value="WEB画像制作のご相談" class="input__radio">
                            <span class="radio__span">WEB画像制作のご相談</span>
                        </label>
                        <label class="label__radio">
                            <input type="radio" name="entry.767609341" value="その他" class="input__radio">
                            <span class="radio__span">その他</span>
                        </label>
                    </div>
                </div>

                <!-- ご予算 -->
                <div class="c-form__item">
                    <label class="c-form__label no-required" for="field-budget">ご予算</label>
                    <input name="entry.1307867165" class="c-form__input" id="field-budget" placeholder="〜30万/相談したい" />
                </div>
                <!-- 希望納期 -->
                <div class="c-form__item">
                    <label class="c-form__label no-required" for="field-nouki">希望納期</label>
                    <input name="entry.1567431506" class="c-form__input" id="field-nouki" placeholder="来月末まで" />
                </div>
                <!-- お問い合わせ内容 -->
                <div class="c-form__item">
                    <label class="c-form__label" for="field-message">お問い合わせ内容</label>
                    <textarea name="entry.317400364" class="c-form__input" id="field-message"
                        placeholder="ご用件の詳細や、&#10;ご相談・ご要望などをご記入ください。" required="required"></textarea>
                </div>
                <!-- 送信ボタン -->
                <div class="c-form__submit">
                    <button type="submit">送信</button>
                </div>

                <iframe name="hidden_iframe" id="hidden_iframe" style="display: none"
                    onload="if(submitted){window.location='thanks.html';}"></iframe>
            </form>

        </section>
    </main>


    <!-- ＝＝＝＝＝共通フッター＝＝＝＝＝ -->
    <div id="footer" data-root="./"></div>

    <!-- jQueryのCDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- inview -->
    <script type="text/javascript" src="js/jquery.inview.min.js"></script>

    <!-- .jsの読み込み -->
    <script src="js/script.js"></script>

    <!-- マウスストーカー -->
    <div class="stalker" id="js-stalker"></div>


</body>

</html>
