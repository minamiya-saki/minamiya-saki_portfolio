<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>373&DESIGN</title>
    <meta name="description" content="373&DESIGNはWEBデザイナーみなみやのポートフォリオサイトです。ホームページ制作・ランディングページ制作・Web画像制作を承っています。">

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- グーグルフォント -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Zen+Kaku+Gothic+New&display=swap"

</head>



<body>
    <!-- メインビジュアル -->
    <div class="mv">
        <!-- メインビジュアル＿＿上部 -->
        <h1 class="mv__title">
            <div class="mv__circle"></div>
            <img src="images/main/logo_web_color.svg" alt="373&DESIGN">
            <img src="images/main/logo_hover.svg" alt="" aria-hidden="true">
        </h1>
        <!-- メインビジュアル＿＿下部 -->
        <div class="mv__object">
            <img src="images/main/mv_blue_tama_back_pc.png" alt="浮かぶ水飛沫" class="blue_tama__back">
            <div class="mv__front--container">
                <!-- スクロールダウン -->
                <div class="scroll__container">
                    <a>
                        <span style="--i:1">S</span>
                        <span style="--i:2">C</span>
                        <span style="--i:3">R</span>
                        <span style="--i:4">O</span>
                        <span style="--i:5">L</span>
                        <span style="--i:6">L</span>
                    </a>
                    <div class="scroll__bar"></div>
                </div>
                <img src="images/main/mv_blue_tama_front_left_pc.png" alt="浮かぶ青玉" class="blue_tama__front--left">
                <img src="images/main/mv_blue_tama_front_center_pc.png" alt="浮かぶ青玉" class="blue_tama__front--center">
                <img src="images/main/mv_blue_tama_front_right_pc.png" alt="浮かぶ青玉" class="blue_tama__front--right">
            </div>
        </div>
    </div>

    <!-- ナビゲーションバー -->
    <header>
        <div class="header__inner">
            <a href="" class="header__inner--logo"><img src="images/main/logo_web_color.svg" alt="373&DESIGNのロゴ"></a>
            <nav class="header__nav">
                <ul>
                    <li><a href="">ABOUT</a></li>
                    <li><a href="">WORKS</a></li>
                    <li><a href="">SERVICE</a></li>
                    <li><a href="">CONTACT</a></li>
                </ul>
            </nav>
        </div>

    </header>






    <!-- ヘッダー -->




    <main>

    </main>
