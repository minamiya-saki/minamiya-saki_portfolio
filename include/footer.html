<footer>
    <picture>
        <source srcset="{root}images/main/footer_nami_sp.svg" media="(max-width:768px)" />
        <img src="{root}images/main/footer_nami_pc.svg" class="footer__wave">
    </picture>
    <div class="footer">
        <div class="footer__container">
            <!-- フッターナビ -->
            <nav class="footer__nav">
                <ul>
                    <li><a href="{root}index.html#about">ABOUT</a></li>
                    <li><a href="{root}index.html#works">WORKS</a></li>
                    <li><a href="{root}index.html#service">SERVICE</a></li>
                    <li><a href="{root}index.html#contact">CONTACT</a></li>
                </ul>
            </nav>
            <div class="footer__icon--container">
                <a href="{root}index.html" class="footer__logo">
                    <img src="{root}images/main/logo_fafdff_web.svg" alt="373&DESIGNのロゴ">
                </a>
                <div class="footer__sns--container">
                    <a href="https://lin.ee/58rOvTp" target="_blank" class="sns">
                        <img src="{root}images/main/line_brand_icon.png" alt="LINEのアイコン">
                    </a>
                    <a href="https://www.instagram.com/373_valley_design?stkn=MXAxNTZ2bGgxdW9zdQ==" target="_blank"
                        class="sns">
                        <img src="{root}images/main/Instagram_Glyph_White.png" alt="Instagramのアイコン">
                    </a>
                </div>
            </div>
            <a href="{root}privacy_policy.html" class="privacy_policy">プライバシーポリシー</a>
            <p class="copyright">©373&DESIGN</p>
        </div>
        <!-- toTOP設置 -->
        <a href="#top" class="totop">
            <!-- 回るテキスト -->
            <div class="totop__svg-wrap">
                <svg class="totop__svg" viewBox="0 0 100 100">
                    <path id="totopPath" class="totop__path" d="M 0 50 A 50 50 0 1 1 0 51 z" />
                    <text class="totop__text">
                        <textPath xlink:href="#totopPath">
                            SCROLL TO TOP
                        </textPath>
                    </text>
                </svg>
            </div>
            <!-- 矢印 -->
            <div class="totop__circle">
                <div class="totop__arrow"></div>
            </div>
        </a>
    </div>
</footer>
